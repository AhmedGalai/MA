services:
  uxplay:
    build:
      context: ./docker
      dockerfile: Dockerfile.uxplay
    container_name: uxplay_avp
    network_mode: "bridge"
    ports:
      - "7000:7000"       # AirPlay control (TCP)
      - "7001:7001"       # AirPlay data (TCP)
      - "7100:7100"       # AirPlay mirror (TCP)
      - "6000:6000/udp"   # AirPlay audio RAOP (UDP)
      - "6001:6001/udp"   # AirPlay audio timing (UDP)
      - "5353:5353/udp"   # mDNS/Bonjour (UDP)
    environment:
      - API_HOST=host.docker.internal
      - API_PORT=8000
    restart: unless-stopped
    # Privileged mode for network access
    privileged: false
