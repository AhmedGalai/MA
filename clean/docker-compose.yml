services:
  uxplay:
    build:
      context: ./docker
      dockerfile: Dockerfile.uxplay
    container_name: uxplay_avp
    network_mode: "host"
    restart: unless-stopped

    # Use host daemons
    volumes:
      - /var/run/dbus:/var/run/dbus
      - /run/avahi-daemon/socket:/run/avahi-daemon/socket
      - /run:/run

    environment:
      - API_HOST=127.0.0.1
      - API_PORT=8000

    # Avahi sometimes needs these; if it still won’t advertise, try privileged: true instead.
    cap_add:
      - NET_ADMIN
      - NET_RAW
